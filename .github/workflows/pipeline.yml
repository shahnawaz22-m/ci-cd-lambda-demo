name: CI CD with Lambda

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/lambda-demo:latest .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/lambda-demo:latest

  notify:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Invoke Lambda Endpoint
        run: |
          curl -X POST https://webhook.site/https://webhook.site/fe8a0a6c-34f7-4e93-96cf-1e2d9afbbc99 \
          -H "Content-Type: application/json" \
          -d '{"message":"Deployment Successful"}'
